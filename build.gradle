plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.jetbrains.kotlin.jvm'
}

group = 'auctionTalk'
version = '0.0.1-SNAPSHOT'
description = 'AuctionTalk for Spring Boot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

// Spring Boot 3.5.16 BOM이 아직 반영하지 못한 같은 라인의 보안 패치.
// 다음 Spring Boot 패치가 이 버전 이상을 관리하면 제거한다.
ext['tomcat.version'] = '10.1.59'       // BOM 10.1.55, CVE-2026-65905 등 (OSV 수정 버전 10.1.58은 Maven Central에 미배포)
ext['netty.version'] = '4.1.138.Final'  // BOM 4.1.135.Final, CVE-2026-75595 등 / CVE-2026-89044(GitHub 미검토, NVD 4.1.133~4.1.137)
ext['jackson-bom.version'] = '2.21.7'   // BOM 2.21.4, CVE-2026-89425 등
// firebase-admin 9.11.0은 httpclient5 5.6.4를 요청하지만 BOM 규칙이 5.5.2로 하향시켜 httpcore5 5.3.6(CVE-2026-54399 등)이 선택됨.
// 라이브러리가 요청한 버전으로 되돌린다.
ext['httpclient5.version'] = '5.6.4'
ext['httpcore5.version'] = '5.4.3'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'

    // query dsl
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

    // security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // oauth
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // jwt
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    implementation 'com.auth0:java-jwt:4.4.0'

    // WebClient
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

    // s3
    implementation 'software.amazon.awssdk:s3:2.20.20'

    // sms
    implementation 'net.nurigo:sdk:4.3.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"

    // fcm
    implementation('com.google.firebase:firebase-admin:9.11.0') {
        // google-cloud-storage가 끌어오는 jackson-dataformat-xml이 있으면 Spring MVC가 XML 변환기를 JSON보다 먼저 등록해
        // Accept 헤더 없는 요청에 XML로 응답한다. FCM만 사용하고 Storage XML API는 쓰지 않으므로 제외한다.
        exclude group: 'com.fasterxml.jackson.dataformat', module: 'jackson-dataformat-xml'
    }

    // batch
    implementation 'org.springframework.boot:spring-boot-starter-batch'

    // metric
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // apple
    implementation 'com.apple.itunes.storekit:app-store-server-library:5.0.0'

    // google
    implementation 'com.google.apis:google-api-services-androidpublisher:v3-rev20260318-2.0.0'
    implementation 'com.google.auth:google-auth-library-oauth2-http'
    implementation 'com.google.http-client:google-http-client-gson'

    constraints {
        // app-store-server-library 5.0.0이 요청하는 1.83에 CVE-2026-0636 등 5건이 있어 하한을 지정
        implementation('org.bouncycastle:bcprov-jdk18on:1.85') { because 'CVE-2026-0636 and 4 more advisories in 1.83' }
        // Spring Boot 3.5가 okhttp 버전 관리를 중단해 net.nurigo:sdk가 요청한 4.10.0으로 하향되는 것을 막고 기존 4.12.0을 유지
        implementation('com.squareup.okhttp3:logging-interceptor:4.12.0') { because 'keep version used before Spring Boot 3.5 upgrade' }
        // firebase-admin·google-auth가 끌어오는 33.6.0-jre에 GHSA-xxph-c9ww-hj94(HIGH, 2026-10-27 공개)가 있어 하한을 지정.
        // OSV 수정 버전 33.7.2는 -jre/-android 변형으로만 배포되므로 기존과 같은 -jre를 쓴다
        implementation('com.google.guava:guava:33.7.2-jre') { because 'GHSA-xxph-c9ww-hj94 fixed in 33.7.2' }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
