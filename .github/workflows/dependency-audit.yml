name: Dependency Audit

# 의존성 해석 결과를 DepTrace로 분석해 배포 클래스패스에 HIGH 이상 취약점이나 금지 라이선스가 있으면 실패시킨다.
# - push/PR: 빌드 파일이나 예외·정책 파일이 바뀔 때
# - schedule: 코드가 그대로여도 새 취약점이 공개되면 잡아내기 위해 매일 실행 (기본 브랜치에 병합된 뒤 동작)
on:
  push:
    paths:
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'deptrace-exceptions.yml'
      - 'deptrace-licenses.yml'
      - '.github/workflows/dependency-audit.yml'
  pull_request:
    paths:
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'deptrace-exceptions.yml'
      - 'deptrace-licenses.yml'
      - '.github/workflows/dependency-audit.yml'
  schedule:
    - cron: '0 0 * * *'   # 매일 09:00 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout DepTrace
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.DEPTRACE_REPOSITORY || 'hig1002/deptrace' }}
          path: .deptrace

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore OSV cache
        uses: actions/cache@v6
        with:
          path: .deptrace-cache
          key: deptrace-${{ github.run_id }}
          restore-keys: deptrace-

      - name: Build DepTrace
        run: ./gradlew -p .deptrace installDist -q

      - name: Export resolved dependency graphs
        id: export
        run: ./gradlew -I .deptrace/init/deptrace.init.gradle deptraceExport --no-configuration-cache

      - name: Analyze and enforce policy
        run: >-
          .deptrace/build/install/deptrace/bin/deptrace analyze
          --graphs build/deptrace
          --out build/deptrace-report
          --cache .deptrace-cache
          --fail-on HIGH
          --exceptions deptrace-exceptions.yml
          --summary "$GITHUB_STEP_SUMMARY"

      # 취약점 게이트가 실패해도 라이선스 결과는 함께 보이도록 그래프 추출만 성공했으면 실행한다
      - name: Check licenses
        if: ${{ !cancelled() && steps.export.outcome == 'success' }}
        run: >-
          .deptrace/build/install/deptrace/bin/deptrace licenses
          --graphs build/deptrace
          --out build/deptrace-report
          --cache .deptrace-cache
          --policy deptrace-licenses.yml
          --summary "$GITHUB_STEP_SUMMARY"

      # 배포 클래스패스 SBOM(CycloneDX 1.6). 취약점 예외는 VEX not_affected로 함께 기록해 산출물로 남긴다
      - name: Generate SBOM
        if: ${{ !cancelled() && steps.export.outcome == 'success' }}
        run: >-
          .deptrace/build/install/deptrace/bin/deptrace sbom
          --graphs build/deptrace
          --out build/deptrace-report/bom.cdx.json
          --cache .deptrace-cache
          --analysis build/deptrace-report/analysis.json
          --exceptions deptrace-exceptions.yml

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deptrace-report
          path: |
            build/deptrace
            build/deptrace-report
